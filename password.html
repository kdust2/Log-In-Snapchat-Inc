<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Password</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --card: #ffffff;
        --border: #e5e5e5;
        --text: #111111;
        --muted: #5c636c;
        --blue: #0daff0;
        --blue-dark: #0a9ad6;
        --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .login-card {
        width: min(100%, 420px);
        min-height: 540px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 22px 26px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .ghost {
        width: 72px;
        height: 79px;
        margin: 0 0 10px;
        flex: none;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        font-weight: 700;
        text-align: center;
      }

      .account-box {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 58px;
        margin: 0 auto 18px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        font-size: clamp(16px, 1.7vw, 22px);
        font-weight: 700;
        text-align: center;
      }

      .username {
        color: var(--text);
        font-weight: 700;
      }

      .not-you {
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
      }

      .not-you:hover {
        text-decoration: underline;
      }

      .form-wrap {
        width: 100%;
      }

      label {
        display: block;
        margin: 0 0 8px;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
      }

      .input-shell {
        position: relative;
      }

      input[type="password"] {
        width: 100%;
        height: 52px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f3f3f3;
        padding: 0 50px 0 18px;
        font-size: 18px;
        color: var(--text);
        outline: none;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      input[type="password"]:focus {
        box-shadow: 0 0 0 3px rgba(13, 175, 240, 0.12);
      }

      .toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .toggle-btn svg {
        width: 28px;
        height: 28px;
        color: #808080;
      }

      .forgot {
        display: block;
        width: 100%;
        margin: 18px auto 18px;
        text-align: center;
        color: var(--blue);
        text-decoration: none;
        font-size: clamp(16px, 1.8vw, 22px);
        font-weight: 700;
      }

      .forgot:hover {
        text-decoration: underline;
      }

      .next-wrap {
        display: flex;
        justify-content: center;
      }

      .next-btn {
        width: min(100%, 300px);
        height: 52px;
        border: none;
        border-radius: 999px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .next-btn:hover {
        background: var(--blue-dark);
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.82);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 999;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #eaeaea;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
      }

      @media (max-width: 520px) {
        .login-card {
          min-height: 500px;
          padding: 18px 18px 20px;
        }

        .ghost {
          width: 62px;
          height: 68px;
        }

        input[type="password"] {
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Verifying account...</div>
    </div>

    <main class="login-card">
      <svg class="ghost" viewBox="0 0 100 110" role="img" aria-label="Ghost logo">
        <path
          d="M50 4c-15.6 0-25 11.4-25 27.1 0 4.7.8 9.2 1.7 13-2.8-2.6-6.2-5.2-9.3-4.1-3.1 1.1-4.4 4.2-2.9 7 1.7 3.2 7.3 5.2 9.2 9.1 1.2 2.4-1.6 5.8-4.1 9.1-3.9 5.1-9 10.1-16.2 13.3-3.6 1.6-2 5.7 1.1 7.3 5.4 2.8 11.4 2.2 16.8 5.6 3.1 1.9 4.8 6.1 9.2 6.1 4.6 0 8-2.7 13.3-2.7s8.7 2.7 13.3 2.7c4.4 0 6.1-4.2 9.2-6.1 5.4-3.4 11.4-2.8 16.8-5.6 3.1-1.6 4.7-5.7 1.1-7.3-7.2-3.2-12.3-8.2-16.2-13.3-2.5-3.3-5.3-6.7-4.1-9.1 1.9-3.9 7.5-5.9 9.2-9.1 1.5-2.8.2-5.9-2.9-7-3.1-1.1-6.5 1.5-9.3 4.1.9-3.8 1.7-8.3 1.7-13C75 15.4 65.6 4 50 4Z"
          fill="#ffffff"
          stroke="#050505"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>

      <h1>Enter Password</h1>

      <div class="account-box">
        <span class="username" id="username-display">user</span>
        <a href="index.html" class="not-you">Not you?</a>
      </div>

      <div class="form-wrap">
        <form id="password-form">
          <label for="password">Password</label>

          <div class="input-shell">
            <input id="password" type="password" autocomplete="current-password" />
            <button type="button" class="toggle-btn" id="toggle-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 12C3.6 8.5 7.2 6 12 6C16.8 6 20.4 8.5 22 12C20.4 15.5 16.8 18 12 18C7.2 18 3.6 15.5 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
          </div>

          <a href="#" class="forgot">Forgot Password</a>

          <div class="next-wrap">
            <button class="next-btn" type="submit">Next</button>
          </div>
        </form>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const username = params.get("username") || "user";
      document.getElementById("username-display").textContent = username;

      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("toggle-password");
      const loadingScreen = document.getElementById("loading-screen");

      togglePassword.addEventListener("click", function () {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        togglePassword.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });

      document.getElementById("password-form").addEventListener("submit", function (event) {
        event.preventDefault();
        loadingScreen.style.display = "flex";

        setTimeout(function () {
          // keep loading active while processing
        }, 1500);
      });
    </script>
  </body>
</html>
